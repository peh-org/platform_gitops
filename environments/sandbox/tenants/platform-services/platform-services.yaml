apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-services
  namespace: flux-system
spec:
  url: https://github.com/peh-org/platform_services.git
  ref:
    branch: main
  interval: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services-base
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: platform-services
  path: ./environments/sandbox/base
  interval: 1m
  timeout: 10m0s
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services-istio
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-services-base
  sourceRef:
    kind: GitRepository
    name: platform-services
  path: ./environments/sandbox/istio
  interval: 1m
  timeout: 10m0s
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services-openbao
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-services-base    # Utilizes the StorageClass
  sourceRef:
    kind: GitRepository
    name: platform-services
  path: ./environments/sandbox/openbao
  interval: 1m
  timeout: 10m0s
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services-eso
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-services-base
  sourceRef:
    kind: GitRepository
    name: platform-services
  path: ./environments/sandbox/eso
  interval: 1m
  timeout: 10m0s
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-services-eso
    - name: platform-services-openbao
  sourceRef:
    kind: GitRepository
    name: platform-services
  path: ./environments/sandbox/secrets
  interval: 1m
  timeout: 30m0s
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services-keycloak
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-services-istio
    - name: platform-services-secrets
  sourceRef:
    kind: GitRepository
    name: platform-services
  path: ./environments/sandbox/keycloak
  interval: 1m
  timeout: 10m0s
  prune: true
  wait: true